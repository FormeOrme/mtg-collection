<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decklist Parser</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-6 -6 112 112'>
    <text x='50' y='85' font-size='100' text-anchor='middle'>📋</text>
</svg>">
    <script src="./js/tailwind-theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1"></script>
    <script type="module" src="./js/decklist.js"></script>
</head>

<body data-nav="decklist" class="relative min-h-screen overflow-x-hidden bg-canvas font-sans text-body antialiased">
    <div aria-hidden="true"
        class="pointer-events-none fixed inset-x-0 top-0 -z-10 h-[520px] bg-[radial-gradient(60%_100%_at_50%_0%,rgba(245,158,11,0.20),rgba(12,10,9,0))]">
    </div>

    <header id="nav"></header>

    <main class="mx-auto w-full max-w-[1440px] px-4 pb-24 pt-10 sm:px-6 lg:px-8">
        <div>
            <h1 class="text-2xl font-semibold tracking-tight text-stone-50 sm:text-[2rem]">Decklist Parser</h1>
            <p class="mt-1.5 text-sm text-muted">Paste an Arena-style decklist and resolve each line to local card data.
            </p>
        </div>

        <section class="mt-8" aria-label="Decklist parser">
            <div class="rounded-2xl border border-line bg-panel p-4 sm:p-5">
                <label class="mb-2 block text-[11px] font-semibold tracking-[0.16em] text-muted uppercase"
                    for="decklistInput">Decklist input</label>
                <textarea id="decklistInput" spellcheck="false"
                    placeholder="4 Improvisation Capstone (SOS) 120&#10;1 Island (SOS) 275&#10;4 Bramble Familiar (WOE) 164"
                    class="h-[44vh] min-h-[320px] w-full resize-y rounded-xl border border-line-input bg-input-bg p-4 font-mono text-[13px] leading-relaxed text-input outline-none transition placeholder:text-placeholder focus:border-accent-mid/70 focus:ring-4 focus:ring-accent-mid/10"></textarea>
                <div class="mt-3 flex flex-wrap gap-2">
                    <button id="parseBtn" type="button"
                        class="inline-flex cursor-pointer items-center justify-center rounded-lg bg-accent-dark px-4 py-2 text-sm font-semibold text-stone-950 transition hover:bg-accent-mid active:translate-y-px disabled:cursor-wait disabled:opacity-60">Parse
                        decklist</button>
                    <button id="clearBtn" type="button"
                        class="inline-flex cursor-pointer items-center justify-center rounded-lg border border-line bg-stone-50/[0.03] px-4 py-2 text-sm font-medium text-muted transition hover:border-line-strong hover:bg-stone-50/[0.06] hover:text-stone-50">Clear</button>
                </div>
                <div id="parseInfo" class="mt-3"></div>
            </div>

            <div class="mt-10 mb-3 flex items-center gap-3">
                <h2 class="text-[11px] font-semibold tracking-[0.16em] text-muted uppercase">Parsed decklist</h2>
                <span class="h-px flex-1 bg-line"></span>
            </div>
            <div id="decklistResults"
                class="grid min-h-[320px] grid-cols-[repeat(auto-fill,minmax(148px,1fr))] gap-3 sm:gap-4">
                <div class="col-span-full rounded-2xl border border-dashed border-line bg-gallery-bg px-6 py-20 text-center">
                    <p class="text-sm font-medium text-muted">No parsed cards yet</p>
                    <p class="mt-1.5 text-xs text-subtle">Paste your list above and run the parser.</p>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
