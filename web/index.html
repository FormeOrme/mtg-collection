<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Arena Card Art Viewer</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-6 -6 112 112'>
    <text x='50' y='85' font-size='100' text-anchor='middle'>🏠</text>
</svg>">
    <script src="./js/tailwind-theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1"></script>
    <script type="module" src="./js/art-view.js"></script>
</head>

<body data-nav="index" class="relative min-h-screen overflow-x-hidden bg-canvas font-sans text-body antialiased">
    <div aria-hidden="true"
        class="pointer-events-none fixed inset-x-0 top-0 -z-10 h-[520px] bg-[radial-gradient(60%_100%_at_50%_0%,rgba(245,158,11,0.20),rgba(12,10,9,0))]">
    </div>

    <header id="nav"></header>

    <main class="mx-auto w-full max-w-[1440px] px-4 pb-24 pt-10 sm:px-6 lg:px-8">
        <div>
            <h1 class="text-[1.75rem] font-semibold tracking-tight text-stone-50 sm:text-4xl">Card Art Viewer</h1>
            <p class="mt-2 text-sm text-muted">Browse every Arena card artwork by set.</p>
        </div>

        <div class="mt-8 flex flex-col gap-2 sm:flex-row sm:items-center">
            <div class="relative min-w-0 flex-1 sm:max-w-xl">
                <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"
                    class="pointer-events-none absolute top-1/2 left-3 h-4 w-4 -translate-y-1/2 text-subtle">
                    <circle cx="9" cy="9" r="5.5"></circle>
                    <path d="m13.5 13.5 3 3" stroke-linecap="round"></path>
                </svg>
                <input id="searchInput" type="text" placeholder="Search cards (min 3 letters)" autocomplete="off"
                    class="w-full rounded-xl border border-line-input bg-input-bg py-2.5 pr-3 pl-9 text-sm text-input outline-none transition placeholder:text-placeholder focus:border-accent-mid/70 focus:ring-4 focus:ring-accent-mid/10">
            </div>
            <button id="clearBtn" type="button"
                class="hidden shrink-0 cursor-pointer rounded-lg border border-line bg-stone-50/[0.03] px-3.5 py-2.5 text-[13px] font-medium text-muted transition hover:border-line-strong hover:bg-stone-50/[0.06] hover:text-stone-50">Clear
                selection</button>
        </div>

        <section class="mt-10">
            <div class="mb-3 flex items-center gap-2">
                <h2 class="text-[11px] font-semibold tracking-[0.16em] text-muted uppercase">Sets</h2>
                <span class="h-px flex-1 bg-line"></span>
                <button id="toggleSetsBtn" type="button" aria-expanded="false" aria-controls="setsContainer"
                    class="cursor-pointer rounded-lg px-2 py-1 text-xs font-medium text-accent transition hover:bg-stone-50/5 hover:text-stone-50">Show
                    all</button>
            </div>
            <div id="setsContainer"
                class="hidden grid grid-cols-2 gap-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5"></div>
        </section>

        <section class="mt-12">
            <div class="mb-3 flex items-center justify-between gap-3">
                <h2 class="text-[11px] font-semibold tracking-[0.16em] text-muted uppercase">Card gallery</h2>
                <span class="h-px flex-1 bg-line"></span>
            </div>
            <div id="galleryInfo"></div>
            <div id="gallery"
                class="grid grid-cols-[repeat(auto-fill,minmax(148px,1fr))] gap-3 sm:gap-4">
                <div class="col-span-full rounded-2xl border border-dashed border-line bg-gallery-bg px-6 py-20 text-center">
                    <p class="text-sm font-medium text-muted">Select a set to view cards</p>
                    <p class="mt-1.5 text-xs text-subtle">Open the set list or search by name.</p>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
